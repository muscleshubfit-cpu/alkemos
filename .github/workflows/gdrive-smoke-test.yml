# GDrive smoke test (GD-1 — dispatch only) (2026-10-04).
#
# WHY: docs/BACKUP-STRATEGY-2026-10-03.md §3.3 picked Google Drive as the
# PRIMARY off-site destination; owner order 2026-10-04 executed GD-0
# (auth mechanism = Service Account) and GD-1 (setup + verification). The
# repo holds the secret GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON (the FULL
# service-account JSON file) but nothing consumed it yet. This job proves,
# with the smallest possible footprint, using rclone — the exact upload
# layer the plan mandates (§3.1-4) for GD-3:
#   (a) the SA authenticates to Google Drive (rclone lsd — a real
#       authenticated Drive call; rclone about is reported when supported
#       but never required: some service accounts cannot call about.get),
#   (b) the backup folder the OWNER SHARED WITH the SA is located by
#       normalized name match ("AlkemosBackups" == "Alkemos Backups" —
#       the owner's shared folder carries a space; measured run
#       37168415521) and is shared with the SA (Editor),
#   (c) a <100-byte test file round-trips: upload → read-back verify →
#       delete → confirmed gone — or the upload failure is DIAGNOSED:
#       Google's no-quota law for SA-owned files (measured runs
#       37168415521 + 37168880937) is reported with the owner decision
#       menu instead of a generic "shared as viewer?" guess,
#   (d) the folder-size measurement vs the 12 GB noisy guard (plan §3.5,
#       updated 2026-10-04). A service account has NO storage quota of
#       its own (about.get returns zeros by design; own-space uploads
#       fail 403 storageQuotaExceeded — measured run 37168415521), so
#       backup bytes live in the shared-folder OWNER's 15 GB account and
#       the guard is enforced on the folder's byte total.
#
# rclone is NOT preinstalled on GitHub ubuntu runners (measured 2026-10-04,
# run 37162424863) — step 1 installs a PINNED release from the official
# mirror with an SHA256 checksum gate (version + hash frozen in this file;
# the official SHA256SUMS value was independently re-verified at pin time).
# This also validates the exact install mechanism GD-3's upload workflow
# will reuse. Env pins use the PINNED_RCLONE_* prefix — never bare
# RCLONE_*: rclone maps RCLONE_<NAME> environment variables to --name
# flags, so RCLONE_VERSION would collide with --version (measured, run
# 37162630012). RCLONE_CONFIG is the one intentional mapping (the real
# --config flag).
#
# Safety properties of this job:
#   - workflow_dispatch ONLY — can never fire on schedule/push/PR.
#   - permissions: {} — the job needs NO GitHub token rights at all.
#   - The secret is normalized by python3 json (never echoed/printed),
#     written to $RUNNER_TEMP with 0600 perms, scrubbed (client_email +
#     project_id) from every printed line, and deleted by an always()
#     cleanup step. Only booleans, byte counts and folder/file NAMES are
#     ever printed — no field of the JSON is revealed.
#   - rclone stderr is captured to a file and scrubbed SYNCHRONOUSLY
#     before any exit (async process substitution raced with exit and
#     swallowed the diagnostic on run 37162689176 — never again).
#   - Run 37162865437 measured the real prerequisite gap: the Drive API
#     was SERVICE_DISABLED on the SA's GCP project (the SA key itself is
#     valid — JWT auth succeeds, the 403 carries project details). This
#     job therefore ATTEMPTS to enable drive.googleapis.com on that one
#     project via the serviceusage API using the SA's own credentials
#     (owner order 2026-10-04 mandates the Drive setup; no privileges
#     are granted to anyone, no IAM is touched — the equivalent of the
#     one-click console Enable). A standalone SA usually LACKS that
#     permission (measured, run 37163067607 — the least-privilege
#     default): the job then prints the exact owner action and WAITS
#     ~12 minutes, auto-continuing the moment the owner clicks Enable —
#     failing honestly (with the guide) only after the window expires.
#   - Runs 37168415521 + 37168880937 measured the platform law that gates
#     GD-1: a standalone Service Account can never OWN files on a consumer
#     Google Drive — zero storage quota, files.create → 403
#     storageQuotaExceeded even inside a folder shared with the SA as
#     Editor (the share itself is fine; the byte would be charged to the
#     SA as the file owner, and the SA has no pool). Writable storage for
#     an SA exists only on Workspace shared drives. The upload step
#     therefore greps that exact error and prints the owner decision
#     menu (OAuth user token / Workspace shared drive / R2 §3.6).
#   - No checkout, no package manager, no script-piped installs: one
#     pinned zip + sha256sum -c - (install discipline A-12 adapted:
#     a checksum-gated pinned artifact instead of apt/npm/curl|bash).
#   - Touches no application code, DB, other workflow, production, DNS,
#     Vercel or Supabase. The ONLY Drive mutations are: the lifetime of
#     one test file inside the owner-shared folder (deleted and verified
#     gone before the job may succeed) and the removal of the EMPTY
#     own-root AlkemosBackups leftover from run 37168415521 (rmdir
#     removes empty folders only — a safety property; failure is
#     non-fatal). No folder is created anymore: the SA's own space can
#     hold zero bytes (the no-quota law above).
#   - Least privilege: the SA key is bounded by Drive folder-level ACLs
#     (own empty root + exactly what is shared with it); OAuth scope is
#     "drive" because drive.file cannot address folders shared WITH a
#     service account — the folder ACL is the privilege boundary
#     (plan §3.1-5). No GCP IAM roles are needed or used here.
#
# Results go to stdout AND $GITHUB_STEP_SUMMARY. Exit 1 on any failed
# check — honest-failure law.
name: GDrive smoke test (GD-1 — dispatch only)

on:
  # TEMP-BRANCH-ONLY trigger (gd1-smoke-test) so the run can start without the
  # workflow being registered on the default branch yet. The dispatch-only
  # variant is what lands on main once this run is green.
  push:
    branches: [gd1-smoke-test]
  workflow_dispatch: {}

concurrency:
  group: gdrive-smoke-test
  cancel-in-progress: false

permissions: {}

env:
  PINNED_RCLONE_VERSION: "1.75.1"
  PINNED_RCLONE_SHA256: "982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab"

jobs:
  gdrive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Install pinned rclone (SHA256-gated)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          ZIP="rclone-v${PINNED_RCLONE_VERSION}-linux-amd64.zip"
          echo "downloading rclone v${PINNED_RCLONE_VERSION} (pinned) from the official mirror…"
          curl -fsSLO "https://downloads.rclone.org/v${PINNED_RCLONE_VERSION}/${ZIP}"
          echo "${PINNED_RCLONE_SHA256}  ${ZIP}" | sha256sum -c -
          unzip -oq "${ZIP}"
          mkdir -p "$RUNNER_TEMP/rclone-bin"
          mv "rclone-v${PINNED_RCLONE_VERSION}-linux-amd64/rclone" "$RUNNER_TEMP/rclone-bin/"
          "$RUNNER_TEMP/rclone-bin/rclone" version | head -1
          echo "$RUNNER_TEMP/rclone-bin" >> "$GITHUB_PATH"

      - name: Drive smoke test (auth → folder → upload → verify → delete)
        env:
          SA_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          SA_FILE="$RUNNER_TEMP/gdrive-sa.json"
          CONF_FILE="$RUNNER_TEMP/rclone.conf"
          RC_ERR="$RUNNER_TEMP/rc.err"
          export SA_FILE CONF_FILE

          if [ -z "${SA_JSON}" ]; then
            echo "::error::secret GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON is empty or missing"
            exit 1
          fi
          # Materialize the secret into a 0600 temp file. NEVER echo it.
          printf '%s' "$SA_JSON" > "$SA_FILE"
          chmod 600 "$SA_FILE"

          python3 << 'PYEOF'
          import json, os, sys
          sa_file = os.environ["SA_FILE"]
          try:
              with open(sa_file, "r", encoding="utf-8") as fh:
                  sa = json.load(fh)
          except Exception as e:
              print(f"::error::secret is not parseable JSON ({type(e).__name__}) — set it to the FULL service-account JSON file content")
              sys.exit(1)
          req = ["type", "project_id", "private_key_id", "private_key", "client_email"]
          missing = [k for k in req if not sa.get(k)]
          if missing:
              print(f"::error::service-account JSON is missing field(s): {', '.join(missing)}")
              sys.exit(1)
          if sa.get("type") != "service_account":
              print('::error::JSON "type" is not "service_account" — refusing to use it')
              sys.exit(1)
          # Normalize (fixes literal \n escapes some secret setters leave) — rewrite silently.
          with open(sa_file, "w", encoding="utf-8") as fh:
              json.dump(sa, fh, indent=2)
          print("SA JSON structure: valid service_account — required fields present (values never printed)")
          # Scrub material for later output filtering — the email/project NEVER appear in logs.
          with open(os.path.join(os.path.dirname(sa_file), "scrub.txt"), "w", encoding="utf-8") as fh:
              fh.write(sa.get("client_email", "") + "\n" + sa.get("project_id", ""))
          print(f"private_key: {len(sa['private_key'])} chars (PEM, not printed)")
          PYEOF

          command -v rclone >/dev/null 2>&1 || {
            echo "::error::rclone not on PATH after the pinned-install step — infrastructure failure, nothing was tested"
            exit 1
          }
          echo "rclone: $(rclone version | head -1)"

          # synchronous scrubber: reads a FILE, prints the scrubbed text, returns
          scrub_file() {
            python3 -c '
          import os, sys
          p = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "scrub.txt")
          repl = []
          try:
              with open(p) as fh:
                  repl = [l for l in fh.read().splitlines() if l]
          except OSError:
              pass
          out = open(sys.argv[1], errors="replace").read() if len(sys.argv) > 1 else ""
          for s in repl:
              out = out.replace(s, "[REDACTED-SA]")
          sys.stdout.write(out)
          ' "$1"
          }
          # run rclone, surface scrubbed stderr synchronously, propagate exit code
          rc() { rclone "$@" 2>"$RC_ERR" || { scrub_file "$RC_ERR" >&2 || true; return 1; }; }

          cat > "$CONF_FILE" <<EOF
          [gdrive]
          type = drive
          scope = drive
          service_account_file = $SA_FILE
          EOF
          chmod 600 "$CONF_FILE"
          export RCLONE_CONFIG="$CONF_FILE"

          die() { echo "::error::smoke test FAILED — $1 (scrubbed rclone error, if any, printed above)"; exit 1; }

          # ---- 0. Ensure the Drive API is enabled on the SA's project ----
          # JWT (RS256 via openssl — the gsc-connection-test pattern) with
          # cloud-platform scope, then ONE serviceusage enable call for
          # drive.googleapis.com. The access token NEVER touches the log.
          python3 << 'PYEOF'
          import base64, json, os, subprocess, sys, time
          import urllib.error, urllib.parse, urllib.request

          sa_file = os.environ["SA_FILE"]
          key_file = os.path.join(os.path.dirname(sa_file), "gdrive-sa.key")
          sa = json.load(open(sa_file))
          with open(key_file, "w") as fh:
              fh.write(sa["private_key"])
          os.chmod(key_file, 0o600)

          def b64u(b):
              return base64.urlsafe_b64encode(b).rstrip(b"=").decode("ascii")

          def scrubbed(s):
              for k in ("client_email", "project_id"):
                  v = sa.get(k) or ""
                  if v:
                      s = s.replace(v, "[REDACTED-SA]")
              return s

          token_uri = sa.get("token_uri") or "https://oauth2.googleapis.com/token"

          def access_token(scope):
              now = int(time.time())
              head = b64u(json.dumps({"alg": "RS256", "typ": "JWT"}, separators=(",", ":")).encode())
              claims = b64u(json.dumps({
                  "iss": sa["client_email"], "scope": scope, "aud": token_uri,
                  "iat": now, "exp": now + 600,
              }, separators=(",", ":")).encode())
              sig = subprocess.run(["openssl", "dgst", "-sha256", "-sign", key_file],
                                   input=(head + "." + claims).encode(),
                                   capture_output=True, check=True).stdout
              body = urllib.parse.urlencode({
                  "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
                  "assertion": head + "." + claims + "." + b64u(sig),
              }).encode()
              req = urllib.request.Request(token_uri, data=body, method="POST")
              req.add_header("Content-Type", "application/x-www-form-urlencoded")
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read())["access_token"]

          def die(msg, detail=""):
              print(f"::error::{msg}")
              if detail:
                  print(scrubbed(detail), file=sys.stderr)
              sys.exit(1)

          # quick Drive-API probe first: if it already works, skip the enable entirely
          def drive_ok():
              try:
                  tok = access_token("https://www.googleapis.com/auth/drive")
              except Exception:
                  return False
              req = urllib.request.Request("https://www.googleapis.com/drive/v3/about?fields=user")
              req.add_header("Authorization", "Bearer " + tok)
              try:
                  urllib.request.urlopen(req, timeout=30)
                  return True
              except urllib.error.HTTPError:
                  return False

          if drive_ok():
              print("Drive API: already enabled/working on the SA project — no enable needed")
              sys.exit(0)

          print("Drive API: not usable yet (probe failed) — attempting enable via serviceusage with the SA credentials…")
          try:
              tok = access_token("https://www.googleapis.com/auth/cloud-platform")
          except Exception as e:
              die("could not mint a cloud-platform token from the SA key", repr(e))

          url = ("https://serviceusage.googleapis.com/v1/projects/"
                 + sa["project_id"] + "/services/drive.googleapis.com:enable")
          req = urllib.request.Request(url, data=b"", method="POST")
          req.add_header("Authorization", "Bearer " + tok)
          try:
              with urllib.request.urlopen(req, timeout=90) as r:
                  print(f"serviceusage enable: HTTP {r.status} — enable requested (operation accepted)")
          except urllib.error.HTTPError as e:
              body = e.read().decode(errors="replace")
              if e.code == 403 or "PERMISSION_DENIED" in body:
                  print("the SA cannot enable APIs on its project (no serviceusage permission — the safe default for a standalone SA, exactly the least-privilege posture the plan mandates).")
                  print("OWNER ACTION (~1 minute, one click): in a browser logged into the Google account that owns the backup SA project, open Google Cloud Console → APIs & Services → Library → search \"Google Drive API\" → Enable. (The exact activation URL with the project number is printed in Google's error inside this job log.)")
                  print("This run now WAITS up to ~12 minutes and auto-continues the moment the Drive API is enabled — no re-run needed if you click within the window. Otherwise re-run this workflow after enabling.")
                  deadline = time.time() + 720
                  n = 0
                  while time.time() < deadline:
                      time.sleep(45)
                      n += 1
                      if drive_ok():
                          print(f"Drive API: ENABLED by the owner after ~{n * 45}s of waiting — proceeding with the full smoke test")
                          sys.exit(0)
                      print(f"still waiting for the Drive API enablement… ({n * 45}s / 720s)", flush=True)
                  print("::error::Drive API still disabled after a 12-minute wait — enable it (owner console click, see OWNER ACTION above), then re-run this workflow")
                  sys.exit(1)
              die(f"serviceusage enable returned HTTP {e.code}", body)
          except Exception as e:
              die("serviceusage enable call failed", repr(e))

          print("enablement propagation: waiting up to ~3 minutes…")
          deadline = time.time() + 180
          while time.time() < deadline:
              time.sleep(25)
              if drive_ok():
                  print("Drive API: now ENABLED and answering — proceeding")
                  sys.exit(0)
          print("::warning::Drive API still not answering after 3 minutes — continuing anyway (rclone will re-verify; if it reports SERVICE_DISABLED, wait a few minutes and re-run)")
          PYEOF

          # ---- 1. Auth proof + quota context ----
          # about.get on a service account reports the SA's OWN pool: ZERO BY
          # DESIGN (SAs get no free 15GB — measured run 37168415521). The 12GB
          # budget lives on the shared-folder OWNER's 15GB account and is
          # enforced on the folder's byte total in section 3 below.
          ABOUT_PRE=""
          if ABOUT_PRE=$(rc about gdrive: --json); then
            echo "rclone about: OK"
            python3 - "$ABOUT_PRE" << 'PYEOF'
          import json, sys
          a = json.loads(sys.argv[1])
          gb = lambda b: (b or 0) / 1024**3
          print("quota (SA own pool): total=%.2fGB · used=%.2fGB · free=%.2fGB · trash=%.2fGB — ZERO by design for a standalone SA; backup bytes live in the shared-folder owner's 15GB account" % (gb(a.get("total")), gb(a.get("used")), gb(a.get("free")), gb(a.get("trash"))))
          PYEOF
          else
            echo "::warning::rclone about is unavailable for this SA (scrubbed error above) — NOT fatal: auth is proven by the lsd call next; some service accounts cannot call about.get"
          fi

          # ---- 2. Folder discovery: SHARED-WITH-ME ONLY ----
          # Measured law (run 37168415521): a service account gets NO storage
          # quota of its own — own-space uploads fail 403 "Service Accounts do
          # not have storage quota". The only writable storage for a standalone
          # SA is a folder the OWNER SHARED with it (the bytes then live in
          # the owner's 15GB account — the plan's budget). Name matching is
          # normalized (whitespace stripped, case-folded): "Alkemos Backups"
          # (the owner's actual shared folder name, measured run 37168415521)
          # and "AlkemosBackups" both resolve.
          # own-root lsd is THE auth proof — fatal on failure.
          if ! RAW_OWN=$(rc lsd gdrive:); then die "auth FAILED — rclone lsd (own root) errored"; fi
          echo "auth: OK (rclone lsd succeeded — the SA authenticates and can list its own root)"
          OWN_DIRS=$(printf '%s\n' "$RAW_OWN" | awk '{$1=$2=$3=$4=""; sub(/^ +/,""); print}' | grep -v '^$' || true)
          SWM_DIRS=""
          if RAW_SWM=$(rc lsd gdrive: --drive-shared-with-me); then
            SWM_DIRS=$(printf '%s\n' "$RAW_SWM" | awk '{$1=$2=$3=$4=""; sub(/^ +/,""); print}' | grep -v '^$' || true)
          else
            echo "::warning::shared-with-me listing unavailable (scrubbed error above) — continuing"
          fi
          echo "SA own-root folders: [$(echo "$OWN_DIRS" | tr '\n' ' ' | sed 's/  */ /g')]"
          echo "folders shared WITH the SA: [$(echo "$SWM_DIRS" | tr '\n' ' ' | sed 's/  */ /g')]"

          norm() { printf '%s' "$1" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]'; }
          REMOTE_NAME=""
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            if [ "$(norm "$d")" = "alkemosbackups" ]; then REMOTE_NAME="$d"; break; fi
          done <<< "$SWM_DIRS"
          if [ -z "$REMOTE_NAME" ]; then
            echo "OWNER ACTION (~1 minute): in the owner's Google Drive, share the backup folder with the SA email (client_email inside the secret JSON) as Editor. The SA has no storage quota of its own — a folder shared WITH it is the only writable path (measured run 37168415521)."
            die "no backup folder (normalized: alkemosbackups) is shared WITH the SA"
          fi
          MODE="found-shared-with-me (owner-account folder — the only writable storage for a standalone SA)"
          REMOTE="gdrive:${REMOTE_NAME}"
          FLAGS=(--drive-shared-with-me)
          echo "folder mode: $MODE → ${REMOTE} ${FLAGS[*]:-}"

          FOLDER_JSON=$(rc lsjson "$REMOTE" "${FLAGS[@]}") || die "cannot list ${REMOTE} (folder not readable by the SA)"
          ROOT_SWM_JSON=$(rc lsjson gdrive: --drive-shared-with-me) || true
          FOLDER_ID=$(printf '%s' "$ROOT_SWM_JSON" | REMOTE_NAME="$REMOTE_NAME" python3 -c '
          import json, os, sys
          want = os.environ.get("REMOTE_NAME", "")
          try:
              for e in json.load(sys.stdin):
                  if e.get("IsDir") and e.get("Name") == want:
                      print(e["ID"]); break
          except Exception:
              pass
          ' 2>/dev/null || true)
          [ -n "$FOLDER_ID" ] && echo "folder ID: $FOLDER_ID (for GD-3 root_folder_id pinning — not a secret)"

          # run 37168415521 left an EMPTY own-root AlkemosBackups folder (created
          # before the no-quota law was measured). rmdir removes EMPTY folders
          # only — a safety property; failure is non-fatal clutter.
          if echo "$OWN_DIRS" | grep -qx "AlkemosBackups"; then
            if rc rmdir gdrive:AlkemosBackups; then
              echo "cleanup: removed the empty own-root AlkemosBackups leftover (run 37168415521) — SA own space can hold zero bytes"
            else
              echo "::warning::own-root AlkemosBackups not empty/removable — left in place (harmless)"
            fi
          fi

          # ---- 3. Writability round-trip: upload → read-back → delete → gone ----
          # The upload is the platform-law checkpoint: consumer Drive charges
          # storage to the file OWNER; an SA owns what it creates but has zero
          # quota → files.create fails 403 storageQuotaExceeded (measured runs
          # 37168415521 + 37168880937 — the Editor ACL is NOT the problem; a
          # viewer share would fail with a permissions error instead).
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          TEST_NAME="gd1-smoke-${TS}.txt"
          CONTENT="alkemos-gd1-drive-smoke ${TS} run=${GITHUB_RUN_ID:-local}"
          printf '%s' "$CONTENT" > "$RUNNER_TEMP/$TEST_NAME"
          if ! rc copyto "$RUNNER_TEMP/$TEST_NAME" "$REMOTE/$TEST_NAME" "${FLAGS[@]}"; then
            if grep -q "storageQuotaExceeded" "$RC_ERR" 2>/dev/null; then
              echo '::error::UPLOAD blocked by the measured Google platform law: a standalone Service Account cannot OWN files on a consumer Drive (zero storage quota — runs 37168415521 + 37168880937). The Editor share on the backup folder is fine; the created byte would be charged to the SA as file owner.'
              echo 'OWNER DECISION required — pick one and order the follow-up:'
              echo '  (1) OAuth user-account token (plan §3.1 option a): $0, refresh-token secret, rclone token config, publish the OAuth consent screen to production to avoid the 7-day testing expiry — GD-1-ALT sketch is in the plan.'
              echo '  (2) Google Workspace shared drive: SAs can write as members, but it is a paid tier.'
              echo '  (3) Cloudflare R2 off-site (plan §3.6 conditional path): free 10GB, needs a billing card.'
              exit 1
            fi
            die "UPLOAD failed — a permissions problem, not the quota law: check the share role on ${REMOTE} (Editor needed) — scrubbed rclone error, if any, printed above"
          fi
          echo "upload: OK ($TEST_NAME, ${#CONTENT} bytes)"
          BACK=$(rc cat "$REMOTE/$TEST_NAME" "${FLAGS[@]}") || die "read-back failed"
          [ "$BACK" = "$CONTENT" ] || die "read-back MISMATCH (content corrupted in transit)"
          echo "read-back: OK (byte-identical)"
          rc lsf "$REMOTE" "${FLAGS[@]}" | grep -qx "$TEST_NAME" || die "uploaded file not visible in listing"
          echo "listing check: OK"

          # folder-size = the GD-3 12GB guard metric (the SA's about pool is
          # zero by design — the budget lives on the folder owner's 15GB
          # account, so the guard is enforced on the folder's byte total)
          SIZE_JSON=$(rc size "$REMOTE" "${FLAGS[@]}" --json) || die "folder-size measurement failed (the GD-3 guard primitive)"
          printf '%s' "$SIZE_JSON" | python3 -c '
          import json, sys
          s = json.loads(sys.stdin.read())
          b = int(s.get("bytes") or 0)
          n = int(s.get("count") or 0)
          gb = b / 1024**3
          print("folder-size: %d objects · %.4fGB total" % (n, gb))
          if b > 12 * 1024**3:
              print("::error::backup folder %.2fGB EXCEEDS the 12GB budget (plan §3.5 guard) — rotate before the next backup run" % gb)
              sys.exit(1)
          print("12GB budget check: OK (folder within budget)")
          '

          rc deletefile "$REMOTE/$TEST_NAME" "${FLAGS[@]}" || die "DELETE failed — test file left behind, remove manually"
          if rc lsf "$REMOTE" "${FLAGS[@]}" | grep -qx "$TEST_NAME"; then
            die "test file STILL PRESENT after delete"
          fi
          echo "delete + gone-check: OK"

          if [ -n "$ABOUT_PRE" ] && ABOUT_POST=$(rc about gdrive: --json); then
            python3 - "$ABOUT_PRE" "$ABOUT_POST" << 'PYEOF'
          import json, sys
          pre, post = json.loads(sys.argv[1]), json.loads(sys.argv[2])
          d = (post.get("used") or 0) - (pre.get("used") or 0)
          print("quota AFTER (SA own pool): used-delta=%+.6fGB — ~0 expected: the test byte is not charged to the SA (no-quota law, run 37168415521); it lives in the shared-folder owner's account" % (d / 1024**3))
          PYEOF
          fi

          # ---- 4. Step summary ----
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## GDrive smoke test (GD-1) — PASSED"
              echo ""
              echo "| Check | Result |"
              echo "|---|---|"
              echo "| SA JSON structure (secret never printed) | valid service_account |"
              echo "| Auth via rclone (SA key) | OK |"
              echo "| Backup folder (shared with the SA) | $MODE · $REMOTE_NAME · writable |"
              echo "| Upload <100-byte test file | OK ($TEST_NAME) |"
              echo "| Read-back + listing verification | OK (byte-identical) |"
              echo "| Test file deleted + verified gone | OK |"
              echo "| Quota budget | 12 GB guard vs folder-owner 15 GB account (plan §3.5, owner order 2026-10-04 — enforced on folder size; the SA own pool is zero by design) |"
              echo ""
              echo "_No backups were touched, no workflow/data changed outside this test file's lifetime. GD-2/GD-3 remain owner-gated._"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "SMOKE TEST: ALL GREEN"

      - name: Cleanup temp files (credentials, config, test file, install artifacts)
        if: always()
        run: |
          rm -f "${RUNNER_TEMP:-/tmp}/gdrive-sa.json" "${RUNNER_TEMP:-/tmp}/gdrive-sa.key" "${RUNNER_TEMP:-/tmp}/scrub.txt" "${RUNNER_TEMP:-/tmp}/rclone.conf" "${RUNNER_TEMP:-/tmp}/rc.err" "${RUNNER_TEMP:-/tmp}"/gd1-smoke-*.txt "${RUNNER_TEMP:-/tmp}"/rclone-v1.*-linux-amd64.zip || true
          rm -rf "${RUNNER_TEMP:-/tmp}/rclone-v1."*-linux-amd64 "${RUNNER_TEMP:-/tmp}/rclone-bin" || true
          echo "temp credential + test + install files removed (runner is ephemeral anyway)"
