name: Remediate blog images (IMAGE SAFETY — people-free regen)

# ONE-OFF owner-directed remediation (2026-08-27): regenerate EVERY
# Pollinations image in published posts / queue bundles through the new
# people-free safety pipeline (src/lib/image-safety.ts), replacing the
# retired negation-prompt URLs that produced immodest renders.
# Re-runnable safely: output URLs never contain banned vocabulary, so a
# second run finds nothing to change in posts (fresh seeds only for the
# remaining offending rows).

on:
  workflow_dispatch: {}

concurrency:
  group: remediate-blog-images
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # PHASE 141 (A-12) — production-locked install: bun reads the SAME
      # bun.lock Vercel and local dev build from, killing the npm
      # fresh-re-resolution drift class (and the 2026-09-03 npm-10
      # arborist crash + npm-11 workaround that fought it). Node stays
      # the RUNTIME — the tsx/npx steps below are unchanged.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen bun.lock = production tree)
        run: bun install --frozen-lockfile

      - name: Migrate all pollinations images to Pexels stock (people OK / NSFW screened)
        run: npx --no-install tsx scripts/blog-runner/remediate-images.mts

      - name: Backfill body images into cover-only published posts
        run: npx --no-install tsx scripts/blog-runner/embed-post-images.mts

      - name: Summary
        if: always()
        run: echo "Remediation pass finished — see counts above."
