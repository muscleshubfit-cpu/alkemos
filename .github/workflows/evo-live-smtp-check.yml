# TEMPORARY — EVO live SMTP check v2 (wide probe). Owner decree
# «smtp مربوط api داخل GitHub secret ، افحصها ونفذ» 2026-09-10.
# DELETE THIS FILE in the same session after the live check passes.
#
# v1 probed 6 classic repo-secret names — all empty. v2:
#   - probes 40 secret names + 12 variable names per scope,
#   - runs THREE scopes in parallel: Production env / repo secrets+vars /
#     Preview env (an environment job sees BOTH env and repo secrets),
#   - when found: validates the key (GET /v3/account), sends ONE real test
#     email FROM evo@alkemos.com (D4 send-only) TO the owner inbox
#     muscleshubfit@gmail.com, then upserts the Vercel production flags
#     EVO_FOLLOWUP_ENABLED / EVO_FOLLOWUP_FROM / EVO_CRON_SECRET (the secret
#     is generated on the runner and NEVER printed).
# Secret values are NEVER printed; GHA also auto-masks them in logs.
name: EVO live SMTP check v2 (TEMPORARY — wide probe)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/evo-live-smtp-check.yml"

concurrency:
  group: evo-live-smtp-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main-check:
    name: Probe + live send + Vercel flags (Production scope)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - name: "1) Probe secret/variable names (values never printed)"
        id: probe
        env:
        K_SMTP_API: ${{ secrets.SMTP_API }}
        K_SMTP_API_KEY: ${{ secrets.SMTP_API_KEY }}
        K_SMTP_KEY: ${{ secrets.SMTP_KEY }}
        K_SMTP: ${{ secrets.SMTP }}
        K_XSMTP_API_KEY: ${{ secrets.XSMTP_API_KEY }}
        K_SMTPAPI_KEY: ${{ secrets.SMTPAPI_KEY }}
        K_SMTP_AND_API_KEY: ${{ secrets.SMTP_AND_API_KEY }}
        K_BREVO: ${{ secrets.BREVO }}
        K_BREVO_KEY: ${{ secrets.BREVO_KEY }}
        K_BREVO_API: ${{ secrets.BREVO_API }}
        K_BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        K_BREVO_API_TOKEN: ${{ secrets.BREVO_API_TOKEN }}
        K_BREVO_TOKEN: ${{ secrets.BREVO_TOKEN }}
        K_BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
        K_BREVO_SMTP_API_KEY: ${{ secrets.BREVO_SMTP_API_KEY }}
        K_SENDINBLUE: ${{ secrets.SENDINBLUE }}
        K_SENDINBLUE_KEY: ${{ secrets.SENDINBLUE_KEY }}
        K_SENDINBLUE_API: ${{ secrets.SENDINBLUE_API }}
        K_SENDINBLUE_API_KEY: ${{ secrets.SENDINBLUE_API_KEY }}
        K_EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
        K_EMAIL_KEY: ${{ secrets.EMAIL_KEY }}
        K_MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
        K_MAIL_KEY: ${{ secrets.MAIL_KEY }}
        K_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        K_SMTP_PASS: ${{ secrets.SMTP_PASS }}
        K_SMTP_USER: ${{ secrets.SMTP_USER }}
        K_EVO_SMTP_API_KEY: ${{ secrets.EVO_SMTP_API_KEY }}
        K_EVO_BREVO_API_KEY: ${{ secrets.EVO_BREVO_API_KEY }}
        K_EVO_BREVO_KEY: ${{ secrets.EVO_BREVO_KEY }}
        K_EVO_MAIL_KEY: ${{ secrets.EVO_MAIL_KEY }}
        K_EVO_EMAIL_API_KEY: ${{ secrets.EVO_EMAIL_API_KEY }}
        K_EVO_API_KEY: ${{ secrets.EVO_API_KEY }}
        K_EVO_SMTP_KEY: ${{ secrets.EVO_SMTP_KEY }}
        K_ALKEMOS_BREVO_API_KEY: ${{ secrets.ALKEMOS_BREVO_API_KEY }}
        K_ALKEMOS_SMTP_API_KEY: ${{ secrets.ALKEMOS_SMTP_API_KEY }}
        K_brevo_api_key: ${{ secrets.brevo_api_key }}
        K_smtp_api_key: ${{ secrets.smtp_api_key }}
        K_xsmtp_api_key: ${{ secrets.xsmtp_api_key }}
        K_smtp_api: ${{ secrets.smtp_api }}
        K_brevo_key: ${{ secrets.brevo_key }}
        V_BREVO_API_KEY: ${{ vars.BREVO_API_KEY }}
        V_SMTP_API_KEY: ${{ vars.SMTP_API_KEY }}
        V_SMTP_API: ${{ vars.SMTP_API }}
        V_XSMTP_API_KEY: ${{ vars.XSMTP_API_KEY }}
        V_BREVO_API: ${{ vars.BREVO_API }}
        V_BREVO_KEY: ${{ vars.BREVO_KEY }}
        V_EVO_BREVO_API_KEY: ${{ vars.EVO_BREVO_API_KEY }}
        V_SMTP_KEY: ${{ vars.SMTP_KEY }}
        V_SENDINBLUE_API_KEY: ${{ vars.SENDINBLUE_API_KEY }}
        V_EMAIL_API_KEY: ${{ vars.EMAIL_API_KEY }}
        V_MAIL_API_KEY: ${{ vars.MAIL_API_KEY }}
        V_BREVO: ${{ vars.BREVO }}
        run: |
          found_var=""
          for name in SMTP_API SMTP_API_KEY SMTP_KEY SMTP XSMTP_API_KEY SMTPAPI_KEY SMTP_AND_API_KEY BREVO BREVO_KEY BREVO_API BREVO_API_KEY BREVO_API_TOKEN BREVO_TOKEN BREVO_SMTP_KEY BREVO_SMTP_API_KEY SENDINBLUE SENDINBLUE_KEY SENDINBLUE_API SENDINBLUE_API_KEY EMAIL_API_KEY EMAIL_KEY MAIL_API_KEY MAIL_KEY SMTP_PASSWORD SMTP_PASS SMTP_USER EVO_SMTP_API_KEY EVO_BREVO_API_KEY EVO_BREVO_KEY EVO_MAIL_KEY EVO_EMAIL_API_KEY EVO_API_KEY EVO_SMTP_KEY ALKEMOS_BREVO_API_KEY ALKEMOS_SMTP_API_KEY brevo_api_key smtp_api_key xsmtp_api_key smtp_api brevo_key; do
            var="K_${name}"
            if [ -n "${!var}" ]; then
              echo "secret ${name}: SET"
              [ -z "$found_var" ] && found_var="K_${name}"
            else
              echo "secret ${name}: empty"
            fi
          done
          for name in BREVO_API_KEY SMTP_API_KEY SMTP_API XSMTP_API_KEY BREVO_API BREVO_KEY EVO_BREVO_API_KEY SMTP_KEY SENDINBLUE_API_KEY EMAIL_API_KEY MAIL_API_KEY BREVO; do
            var="V_${name}"
            if [ -n "${!var}" ]; then
              echo "variable ${name}: SET"
              [ -z "$found_var" ] && found_var="V_${name}"
            else
              echo "variable ${name}: empty"
            fi
          done
          if [ -z "$found_var" ]; then
            echo "::error::No Brevo key found in Production env / repo secrets / repo variables (probed 40 secret names + 12 variable names) — add it as repository secret BREVO_API_KEY (Settings ▸ Secrets and variables ▸ Actions)"
            exit 1
          fi
          echo "✓ using ${found_var}"
          echo "USING_VAR=${found_var}" >> "$GITHUB_OUTPUT"

          echo "USING_NAME=$found_var" >> "$GITHUB_OUTPUT"

      - name: "2) Validate the key live — GET /v3/account"
        env:
          USING: ${{ steps.probe.outputs.USING_NAME }}
        K_SMTP_API: ${{ secrets.SMTP_API }}
        K_SMTP_API_KEY: ${{ secrets.SMTP_API_KEY }}
        K_SMTP_KEY: ${{ secrets.SMTP_KEY }}
        K_SMTP: ${{ secrets.SMTP }}
        K_XSMTP_API_KEY: ${{ secrets.XSMTP_API_KEY }}
        K_SMTPAPI_KEY: ${{ secrets.SMTPAPI_KEY }}
        K_SMTP_AND_API_KEY: ${{ secrets.SMTP_AND_API_KEY }}
        K_BREVO: ${{ secrets.BREVO }}
        K_BREVO_KEY: ${{ secrets.BREVO_KEY }}
        K_BREVO_API: ${{ secrets.BREVO_API }}
        K_BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        K_BREVO_API_TOKEN: ${{ secrets.BREVO_API_TOKEN }}
        K_BREVO_TOKEN: ${{ secrets.BREVO_TOKEN }}
        K_BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
        K_BREVO_SMTP_API_KEY: ${{ secrets.BREVO_SMTP_API_KEY }}
        K_SENDINBLUE: ${{ secrets.SENDINBLUE }}
        K_SENDINBLUE_KEY: ${{ secrets.SENDINBLUE_KEY }}
        K_SENDINBLUE_API: ${{ secrets.SENDINBLUE_API }}
        K_SENDINBLUE_API_KEY: ${{ secrets.SENDINBLUE_API_KEY }}
        K_EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
        K_EMAIL_KEY: ${{ secrets.EMAIL_KEY }}
        K_MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
        K_MAIL_KEY: ${{ secrets.MAIL_KEY }}
        K_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        K_SMTP_PASS: ${{ secrets.SMTP_PASS }}
        K_SMTP_USER: ${{ secrets.SMTP_USER }}
        K_EVO_SMTP_API_KEY: ${{ secrets.EVO_SMTP_API_KEY }}
        K_EVO_BREVO_API_KEY: ${{ secrets.EVO_BREVO_API_KEY }}
        K_EVO_BREVO_KEY: ${{ secrets.EVO_BREVO_KEY }}
        K_EVO_MAIL_KEY: ${{ secrets.EVO_MAIL_KEY }}
        K_EVO_EMAIL_API_KEY: ${{ secrets.EVO_EMAIL_API_KEY }}
        K_EVO_API_KEY: ${{ secrets.EVO_API_KEY }}
        K_EVO_SMTP_KEY: ${{ secrets.EVO_SMTP_KEY }}
        K_ALKEMOS_BREVO_API_KEY: ${{ secrets.ALKEMOS_BREVO_API_KEY }}
        K_ALKEMOS_SMTP_API_KEY: ${{ secrets.ALKEMOS_SMTP_API_KEY }}
        K_brevo_api_key: ${{ secrets.brevo_api_key }}
        K_smtp_api_key: ${{ secrets.smtp_api_key }}
        K_xsmtp_api_key: ${{ secrets.xsmtp_api_key }}
        K_smtp_api: ${{ secrets.smtp_api }}
        K_brevo_key: ${{ secrets.brevo_key }}
        V_BREVO_API_KEY: ${{ vars.BREVO_API_KEY }}
        V_SMTP_API_KEY: ${{ vars.SMTP_API_KEY }}
        V_SMTP_API: ${{ vars.SMTP_API }}
        V_XSMTP_API_KEY: ${{ vars.XSMTP_API_KEY }}
        V_BREVO_API: ${{ vars.BREVO_API }}
        V_BREVO_KEY: ${{ vars.BREVO_KEY }}
        V_EVO_BREVO_API_KEY: ${{ vars.EVO_BREVO_API_KEY }}
        V_SMTP_KEY: ${{ vars.SMTP_KEY }}
        V_SENDINBLUE_API_KEY: ${{ vars.SENDINBLUE_API_KEY }}
        V_EMAIL_API_KEY: ${{ vars.EMAIL_API_KEY }}
        V_MAIL_API_KEY: ${{ vars.MAIL_API_KEY }}
        V_BREVO: ${{ vars.BREVO }}
        run: |
          KEY="${!USING}"
          code=$(curl -s -o /tmp/account.json -w "%{http_code}" \
            -H "api-key: ${KEY}" -H "accept: application/json" \
            "https://api.brevo.com/v3/account")
          echo "GET /v3/account → HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::error::Brevo key rejected (HTTP ${code}) — check the secret value"
            exit 1
          fi
          echo "✓ Brevo account reachable — key valid."

      - name: "3) LIVE send — test email from evo@alkemos.com to the owner"
        env:
          USING: ${{ steps.probe.outputs.USING_NAME }}
        K_SMTP_API: ${{ secrets.SMTP_API }}
        K_SMTP_API_KEY: ${{ secrets.SMTP_API_KEY }}
        K_SMTP_KEY: ${{ secrets.SMTP_KEY }}
        K_SMTP: ${{ secrets.SMTP }}
        K_XSMTP_API_KEY: ${{ secrets.XSMTP_API_KEY }}
        K_SMTPAPI_KEY: ${{ secrets.SMTPAPI_KEY }}
        K_SMTP_AND_API_KEY: ${{ secrets.SMTP_AND_API_KEY }}
        K_BREVO: ${{ secrets.BREVO }}
        K_BREVO_KEY: ${{ secrets.BREVO_KEY }}
        K_BREVO_API: ${{ secrets.BREVO_API }}
        K_BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        K_BREVO_API_TOKEN: ${{ secrets.BREVO_API_TOKEN }}
        K_BREVO_TOKEN: ${{ secrets.BREVO_TOKEN }}
        K_BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
        K_BREVO_SMTP_API_KEY: ${{ secrets.BREVO_SMTP_API_KEY }}
        K_SENDINBLUE: ${{ secrets.SENDINBLUE }}
        K_SENDINBLUE_KEY: ${{ secrets.SENDINBLUE_KEY }}
        K_SENDINBLUE_API: ${{ secrets.SENDINBLUE_API }}
        K_SENDINBLUE_API_KEY: ${{ secrets.SENDINBLUE_API_KEY }}
        K_EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
        K_EMAIL_KEY: ${{ secrets.EMAIL_KEY }}
        K_MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
        K_MAIL_KEY: ${{ secrets.MAIL_KEY }}
        K_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        K_SMTP_PASS: ${{ secrets.SMTP_PASS }}
        K_SMTP_USER: ${{ secrets.SMTP_USER }}
        K_EVO_SMTP_API_KEY: ${{ secrets.EVO_SMTP_API_KEY }}
        K_EVO_BREVO_API_KEY: ${{ secrets.EVO_BREVO_API_KEY }}
        K_EVO_BREVO_KEY: ${{ secrets.EVO_BREVO_KEY }}
        K_EVO_MAIL_KEY: ${{ secrets.EVO_MAIL_KEY }}
        K_EVO_EMAIL_API_KEY: ${{ secrets.EVO_EMAIL_API_KEY }}
        K_EVO_API_KEY: ${{ secrets.EVO_API_KEY }}
        K_EVO_SMTP_KEY: ${{ secrets.EVO_SMTP_KEY }}
        K_ALKEMOS_BREVO_API_KEY: ${{ secrets.ALKEMOS_BREVO_API_KEY }}
        K_ALKEMOS_SMTP_API_KEY: ${{ secrets.ALKEMOS_SMTP_API_KEY }}
        K_brevo_api_key: ${{ secrets.brevo_api_key }}
        K_smtp_api_key: ${{ secrets.smtp_api_key }}
        K_xsmtp_api_key: ${{ secrets.xsmtp_api_key }}
        K_smtp_api: ${{ secrets.smtp_api }}
        K_brevo_key: ${{ secrets.brevo_key }}
        V_BREVO_API_KEY: ${{ vars.BREVO_API_KEY }}
        V_SMTP_API_KEY: ${{ vars.SMTP_API_KEY }}
        V_SMTP_API: ${{ vars.SMTP_API }}
        V_XSMTP_API_KEY: ${{ vars.XSMTP_API_KEY }}
        V_BREVO_API: ${{ vars.BREVO_API }}
        V_BREVO_KEY: ${{ vars.BREVO_KEY }}
        V_EVO_BREVO_API_KEY: ${{ vars.EVO_BREVO_API_KEY }}
        V_SMTP_KEY: ${{ vars.SMTP_KEY }}
        V_SENDINBLUE_API_KEY: ${{ vars.SENDINBLUE_API_KEY }}
        V_EMAIL_API_KEY: ${{ vars.EMAIL_API_KEY }}
        V_MAIL_API_KEY: ${{ vars.MAIL_API_KEY }}
        V_BREVO: ${{ vars.BREVO }}
        run: |
          KEY="${!USING}"
          body=$(jq -n \
            --arg subj "EVO live SMTP check — $(date -u '+%Y-%m-%d %H:%M UTC')" \
            '{sender:{name:"EVO — Alkemos",email:"evo@alkemos.com"},
              to:[{email:"muscleshubfit@gmail.com"}],
              subject:$subj,
              htmlContent:"<p>فحص حي ناجح — مسار رسالة المتابعة الأسبوعية من EVO جاهز (D4: إرسال-فقط).</p><p>Live SMTP check passed.</p>",
              textContent:"EVO live SMTP check passed — weekly follow-up path ready (send-only)."}')
          code=$(curl -s -o /tmp/send.json -w "%{http_code}" -X POST \
            -H "api-key: ${KEY}" -H "content-type: application/json" -H "accept: application/json" \
            -d "$body" "https://api.brevo.com/v3/smtp/email")
          echo "POST /v3/smtp/email → HTTP ${code}"
          if [ "$code" = "201" ]; then
            echo "messageId: $(jq -r '.messageId // "n/a"' /tmp/send.json)"
            echo "✅ LIVE CHECK PASSED — Brevo accepted; owner inbox receives it."
          else
            echo "::error::Brevo send failed (HTTP ${code}) — is evo@alkemos.com a verified sender?"
            jq -r '.message // .code // empty' /tmp/send.json 2>/dev/null || true
            exit 1
          fi

      - name: "4) Vercel env flags (production upsert) — activation step 2"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN missing — env flags NOT set (manual fallback: Vercel ▸ alkemos ▸ Settings ▸ Environment Variables)"
            exit 0
          fi
          cron_secret=$(openssl rand -hex 32)
          set_var() {
            key="$1"; value="$2"
            code=$(jq -n --arg k "$key" --arg v "$value" \
              '{name:$k,value:$v,type:"encrypted",target:["production"]}' \
              | curl -s -o /tmp/vres.json -w "%{http_code}" -X POST \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" -H "content-type: application/json" \
                --data-binary @- "https://api.vercel.com/v10/projects/alkemos/env?upsert=true")
            echo "set ${key} → HTTP ${code}"
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              head -c 300 /tmp/vres.json; echo
              return 1
            fi
          }
          ok=1
          set_var EVO_FOLLOWUP_ENABLED "true" || ok=0
          set_var EVO_FOLLOWUP_FROM "EVO — Alkemos <evo@alkemos.com>" || ok=0
          set_var EVO_CRON_SECRET "$cron_secret" || ok=0
          if [ "$ok" = "1" ]; then
            echo "✅ Vercel env flags set (production) — live on the NEXT deployment."
          else
            echo "::error::Some Vercel env vars failed — manual fallback: Vercel dashboard"
            exit 1
          fi

