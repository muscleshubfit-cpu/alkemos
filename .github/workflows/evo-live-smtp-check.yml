              echo "variable ${name}: SET"
              [ -z "$found_var" ] && found_var="V_${name}"
            else
              echo "variable ${name}: empty"
            fi
          done
          if [ -z "$found_var" ]; then
            echo "::notice::no candidate set in this scope (informational)"
            exit 0
          fi
          echo "✓ using ${found_var}"
          echo "USING_VAR=${found_var}" >> "$GITHUB_OUTPUT"


